<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">

<title>سورة الانفطار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Amiri+Quran&family=Aref+Ruqaa:wght@700&family=Saira+Condensed:wght@600&display=block" rel="stylesheet">
<link rel="stylesheet" href="../../engine/player.css">
<style>

  #stage .basmala{position:absolute;left:0;width:720px;top:22px;text-align:center;direction:rtl;font:400 36px "Amiri Quran",Amiri,serif;color:#2a221a;line-height:56px}
  #stage .handle{position:absolute;left:0;width:720px;top:800px;text-align:center;font:600 15px "Saira Condensed",sans-serif;letter-spacing:1.5px;color:#8a7d6a}
</style>
</head>
